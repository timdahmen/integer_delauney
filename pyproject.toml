[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "delauney"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# scipy is the exact-geometry oracle the CUDA paths are tested against
# (tests/test_scipy_oracle.py). Test-only; the library itself needs numpy alone.
dev = ["pytest>=8", "pytest-cov", "scipy>=1.10"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-DWITH_CUDA=ON", "-GNinja"]
wheel.packages = ["src/delauney"]

[tool.pytest.ini_options]
testpaths = ["tests"]
